<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel of Fortune — TV Big Board</title>
  <link rel="stylesheet" href="../css/game.css?v=46" />
  <link rel="stylesheet" href="css/multiplayer.css?v=9" />
  <link rel="stylesheet" href="css/big-board.css?v=11" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
</head>
<body class="host-page big-board-page is-loading">
  <div id="loading-screen" class="loading-screen" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="loading-label">
    <div class="loading-screen-inner">
      <p class="loading-brand">Wheel of Fortune</p>
      <p id="loading-label" class="loading-label">Connecting to room…</p>
      <div class="loading-track">
        <div id="loading-bar" class="loading-bar"></div>
      </div>
      <p id="loading-percent" class="loading-percent">0%</p>
    </div>
  </div>

  <p id="spectator-banner" class="spectator-banner is-hidden" aria-live="polite">Watching — read only</p>

  <header class="big-board-header">
    <p id="round-label" class="big-board-round">Waiting</p>
    <p id="turn-banner" class="turn-banner" aria-live="polite"></p>
    <div class="big-board-header-right">
      <div id="scoreboard" class="scoreboard" aria-live="polite"></div>
      <button id="btn-fullscreen" type="button" class="btn-fullscreen" title="Enter fullscreen" aria-label="Toggle fullscreen">⛶</button>
    </div>
  </header>

  <div id="tossup-countdown" class="tossup-countdown is-hidden" aria-live="assertive">3</div>
  <div id="round-countdown" class="round-countdown is-hidden" aria-live="assertive">
    <p class="round-countdown-label">Next round starts in</p>
    <p class="round-countdown-seconds">10</p>
  </div>
  <div id="final-timer" class="final-timer is-hidden" aria-live="polite">0:30</div>

  <main class="big-board-main">
    <div class="layout">
      <section class="board-section">
        <div class="board-top-meta">
          <h1 id="category-pill" class="category-headline" aria-live="polite">—</h1>
        </div>
        <p id="message-bar" class="message-bar" aria-live="polite"></p>
        <div id="puzzle-board" class="puzzle-board" aria-label="Puzzle board">
          <div id="prize-banner" class="prize-banner is-hidden" aria-live="polite">
            <p class="prize-banner-subtitle">New Car</p>
            <p class="prize-banner-title">You Won!</p>
            <p class="prize-banner-name"></p>
            <p class="prize-banner-detail is-hidden"></p>
          </div>
          <div id="round-summary" class="round-summary is-hidden" aria-live="polite">
            <p class="round-summary-round">Round 1</p>
            <p class="round-summary-title">Round Winner!</p>
            <p class="round-summary-winner">Player</p>
            <p class="round-summary-amount">$0</p>
            <p class="round-summary-detail"></p>
            <p class="round-summary-scores is-hidden"></p>
          </div>
          <div id="puzzle-tiles" class="puzzle-tiles"></div>
        </div>
      </section>
    </div>

    <div id="letter-track" class="letter-track" aria-label="Letters called"></div>
  </main>

  <section id="wheel-section" class="wheel-section wheel-dock">
    <div id="final-envelope-panel" class="final-envelope-panel is-hidden">
      <p class="final-envelope-heading">Bonus Envelopes</p>
      <div id="envelope-tray" class="envelope-tray" aria-label="Final Round envelope tray"></div>
      <p id="sealed-envelope-note" class="sealed-envelope-note is-hidden">Your bonus is sealed in the highlighted envelope.</p>
    </div>
    <div class="wheel-wrap">
      <div class="wheel-inner">
        <div class="wheel-pointer" aria-hidden="true"></div>
        <div id="wheel-host"></div>
      </div>
      <div class="wheel-bottom-pointer" aria-hidden="true"></div>
    </div>
    <div id="wedge-result" class="wedge-result">—</div>
  </section>

  <aside class="host-dock" aria-label="Host controls">
    <p class="host-dock-handle">Host controls</p>
    <nav class="host-row" aria-label="Game sections">
      <button id="btn-tossup" type="button" class="btn btn-secondary btn-round" data-round="tossup">Toss-Up</button>
      <button id="btn-round1" type="button" class="btn btn-secondary btn-round" data-round="round1">Round 1</button>
      <button id="btn-round2" type="button" class="btn btn-secondary btn-round" data-round="round2">Round 2</button>
      <button id="btn-final" type="button" class="btn btn-secondary btn-round" data-round="final">Final</button>
    </nav>
    <section class="host-controls">
      <div class="host-control-buttons">
        <button id="btn-start-game" type="button" class="btn btn-primary" disabled>Start Game</button>
        <button id="btn-new-puzzle" type="button" class="btn btn-secondary" disabled>New Puzzle</button>
        <button id="btn-next-round" type="button" class="btn btn-primary" disabled>Next Round</button>
      </div>
      <p id="app-version" class="app-version"></p>
    </section>
  </aside>

  <div id="envelope-reveal-modal" class="modal-backdrop is-hidden" role="dialog" aria-modal="true" aria-labelledby="envelope-reveal-title">
    <div class="modal envelope-reveal-modal">
      <div class="envelope-graphic" aria-hidden="true">
        <div class="envelope-flap"></div>
        <div class="envelope-body">
          <p id="envelope-reveal-amount" class="envelope-reveal-amount">$0</p>
        </div>
      </div>
      <h2 id="envelope-reveal-title">Opening envelope…</h2>
      <p id="envelope-reveal-detail" class="envelope-reveal-detail"></p>
      <div class="modal-actions">
        <button id="btn-envelope-dismiss" type="button" class="btn btn-primary">Continue</button>
      </div>
    </div>
  </div>

  <script type="module">
    import("../js/host-app.js?v=35").catch((err) => {
      console.error(err);
      document.body.classList.remove("is-loading");
      const bar = document.getElementById("message-bar");
      if (bar) {
        bar.textContent = `Failed to load TV display (${err.message}). Hard refresh (⌘⇧R).`;
        bar.classList.add("is-visible");
      }
    });
  </script>
</body>
</html>
